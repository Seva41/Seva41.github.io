<!DOCTYPE html>
<html lang="{{ page.lang | default: 'es' }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="{{ page.description }}" />
    <meta name="theme-color" content="#0a0d14" />
    <title>{{ page.title }}</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{ page.title }}" />
    <meta property="og:description" content="{{ page.description }}" />
    <meta property="og:url" content="{{ site.url }}/" />
    <meta property="og:image" content="{{ site.url }}/assets/img/perfil-escenario.jpg" />
    <!-- Antes de pintar: idioma y vista activa (según el #), para que no parpadee -->
    <script>
      (function () {
        var d = document.documentElement, l = 'es';
        try { l = localStorage.getItem('idiomaSeleccionado') || 'es'; } catch (e) {}
        var vistas = ['inicio', 'syncdisp', 'experiencia', 'proyectos', 'sobre-mi', 'contacto'];
        var alias = { intro: 'inicio', about: 'sobre-mi', experience: 'experiencia', skills: 'sobre-mi', habilidades: 'sobre-mi', reconocimientos: 'sobre-mi', contact: 'contacto' };
        var v = decodeURIComponent(location.hash.slice(1));
        v = alias[v] || v;
        d.classList.add('lang-' + l, 'js');
        d.lang = l;
        d.setAttribute('data-view', vistas.indexOf(v) >= 0 ? v : 'inicio');
        setTimeout(function () { if (!window.__mainOk) d.classList.remove('js'); }, 3000);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap" />
    <link rel="stylesheet" href="{{ '/style.css?v=3.1' | relative_url }}" />
    <link rel="icon" href="{{ '/assets/icons/favicon.ico?v=1.0' | relative_url }}" type="image/x-icon" />
    <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/icons/favicon-16x16.png?v=1.0' | relative_url }}" />
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/icons/favicon-32x32.png?v=1.0' | relative_url }}" />
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/icons/apple-touch-icon.png?v=1.0' | relative_url }}" />
    <link rel="manifest" href="{{ '/assets/icons/site.webmanifest?v=1.0' | relative_url }}" />
    <script defer src="{{ '/assets/js/main.js?v=3.1' | relative_url }}"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content"><span class="es">Saltar al contenido</span><span class="en">Skip to content</span></a>
    {% include navbar.html %}
    {{ content }}
    {% include footer.html %}
  </body>
</html>
