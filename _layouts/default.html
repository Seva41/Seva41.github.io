<!DOCTYPE html>
<html lang="{{ page.lang | default: 'es' }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="{{ page.description }}" />
    <meta name="theme-color" content="#ff7a1f" />
    <title>{{ page.title }}</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{ page.title }}" />
    <meta property="og:description" content="{{ page.description }}" />
    <meta property="og:url" content="{{ site.url }}/" />
    <meta property="og:image" content="{{ site.url }}/assets/img/perfil-escenario.jpg" />
    <!-- Establece la clase de idioma antes de pintar para evitar FOUC -->
    <script>(function(){var d=document.documentElement,l='es';try{l=localStorage.getItem('idiomaSeleccionado')||'es';}catch(e){}d.classList.add('lang-'+l,'js');d.lang=l;setTimeout(function(){if(!window.__mainOk)d.classList.remove('js');},3000);})();</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Besley:wght@800&family=Libre+Franklin:ital,wght@0,400;0,600;1,400&display=swap" />
    <link rel="stylesheet" href="{{ '/style.css?v=2.0' | relative_url }}" />
    <link rel="icon" href="{{ '/assets/icons/favicon.ico?v=1.0' | relative_url }}" type="image/x-icon" />
    <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/icons/favicon-16x16.png?v=1.0' | relative_url }}" />
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/icons/favicon-32x32.png?v=1.0' | relative_url }}" />
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/icons/apple-touch-icon.png?v=1.0' | relative_url }}" />
    <link rel="manifest" href="{{ '/assets/icons/site.webmanifest?v=1.0' | relative_url }}" />
    <script defer src="{{ '/assets/js/main.js?v=2.0' | relative_url }}"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content"><span class="es">Saltar al contenido</span><span class="en">Skip to content</span></a>
    {{ content }}
    {% include footer.html %}
  </body>
</html>
