<!DOCTYPE html>
<html lang="{{ page.lang | default: 'es' }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="{{ page.description }}" />
    <meta name="theme-color" content="#0a0d14" />
    <title>{{ page.title }}</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{ page.title }}" />
    <meta property="og:description" content="{{ page.description }}" />
    <meta property="og:url" content="{{ site.url }}/" />
    <meta property="og:image" content="{{ site.url }}/assets/img/perfil-escenario.jpg" />
    <!-- Antes de pintar: idioma y vista activa. Sin defer a propósito; archivo aparte por la CSP (sin scripts inline) -->
    <script src="{{ '/assets/js/init.js?v=1.1' | relative_url }}"></script>
    <link rel="preload" href="{{ '/assets/fonts/schibsted-grotesk-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="{{ '/style.css?v=3.3' | relative_url }}" />
    <link rel="icon" href="{{ '/assets/icons/favicon.ico?v=1.0' | relative_url }}" type="image/x-icon" />
    <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/icons/favicon-16x16.png?v=1.0' | relative_url }}" />
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/icons/favicon-32x32.png?v=1.0' | relative_url }}" />
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/icons/apple-touch-icon.png?v=1.0' | relative_url }}" />
    <link rel="manifest" href="{{ '/assets/icons/site.webmanifest?v=1.0' | relative_url }}" />
    <script defer src="{{ '/assets/js/main.js?v=3.3' | relative_url }}"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content"><span class="es">Saltar al contenido</span><span class="en">Skip to content</span></a>
    {% include navbar.html %}
    {{ content }}
    {% include footer.html %}
  </body>
</html>
